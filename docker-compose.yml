services:
  app:
    build:
      dockerfile: Dockerfile
      context: .
    image: cab432-app:latest
    container_name: cab432-app
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8000}
      - AWS_PROFILE=CAB432-STUDENT-901444280953
      - MEMCACHED_ENDPOINT=memcached:11211
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro
    ports:
      - "${PORT:-8000}:8000"
    restart: unless-stopped
    depends_on:
      - memcached
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: cab432-worker:latest
    env_file:
      - .env
    environment:
      - AWS_PROFILE=CAB432-STUDENT-901444280953
      - MEMCACHED_ENDPOINT=memcached:11211
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro
    depends_on:
      - memcached
    restart: unless-stopped

  # NEW: DLQ reprocessor microservice
  dlq:
    build:
      context: .
      dockerfile: Dockerfile.dlq
    image: cab432-dlq:latest
    env_file:
      - .env
    environment:
      - AWS_PROFILE=CAB432-STUDENT-901444280953
      - AWS_REGION=ap-southeast-2
      # 🔁 replace these with your actual SQS URLs
      - DLQ_URL=https://sqs.ap-southeast-2.amazonaws.com/901444280953/a3-g58-workerqueue-dlq
      - MAIN_QUEUE_URL=https://sqs.ap-southeast-2.amazonaws.com/901444280953/a3-g58-workerqueue
      # optional tuning
      - WAIT_SECONDS=20
      - MAX_BATCH=5
      - VIS_SECONDS=300
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro
    restart: unless-stopped

  memcached:
    image: memcached:1.6-alpine
    container_name: memcached
    command: ["-m", "128", "-I", "2m"]
    restart: unless-stopped
    ports:
      - "11211:11211"

name: cab432
