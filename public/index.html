<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video Transcoder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .bg-court {
        background: radial-gradient(
            1200px 600px at 20% -10%,
            #7dd3fc33,
            transparent
          ),
          radial-gradient(1200px 600px at 80% 110%, #86efac33, transparent),
          linear-gradient(135deg, #0b1220 0%, #0f172a 100%);
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Inter, system-ui, Segoe UI, Roboto, Helvetica, Arial,
          sans-serif;
      }
    </style>
  </head>
  <body class="bg-court min-h-screen text-slate-100">
    <div class="max-w-6xl mx-auto px-6 py-6">
      <header class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
          <div
            class="h-10 w-10 grid place-items-center rounded-xl bg-emerald-500/20 border border-emerald-400/30"
          >
            🏸
          </div>
          <h2 class="text-xl font-semibold">Video Transcoder</h2>
        </div>
        <button
          id="logoutBtn"
          class="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 border border-white/10"
        >
          Logout
        </button>
      </header>

      <section class="grid md:grid-cols-2 gap-6 mb-8">
        <div
          class="bg-white/10 backdrop-blur border border-white/10 rounded-2xl p-5"
        >
          <h3 class="font-semibold mb-4">Upload</h3>
          <input
            id="title"
            placeholder="optional title"
            class="w-full mb-3 px-3 py-2 rounded bg-slate-900/60 border border-white/10"
          />
          <div class="flex items-center gap-2 mb-3">
            <input
              id="fileInput"
              type="file"
              accept="video/*"
              class="w-full text-sm"
            />
            <button
              id="uploadBtn"
              class="px-4 py-2 rounded bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-semibold"
            >
              Upload
            </button>
          </div>
        </div>

        <div
          class="bg-white/10 backdrop-blur border border-white/10 rounded-2xl p-5"
        >
          <video id="player" class="w-full rounded hidden" controls></video>
          <p class="text-sm text-slate-300 mt-2">
            Select a completed video to play at 720p.
          </p>
        </div>
      </section>

      <section
        class="bg-white/10 backdrop-blur border border-white/10 rounded-2xl p-5"
      >
        <div
          class="flex flex-col md:flex-row md:items-end md:justify-between gap-3 mb-4"
        >
          <h3 class="font-semibold">Your Videos</h3>
          <div class="flex flex-wrap items-center gap-2 text-sm">
            <input
              id="q"
              placeholder="search title"
              class="px-3 py-2 rounded bg-slate-900/60 border border-white/10"
            />
            <input
              id="tag"
              placeholder="filter tag (e.g. person)"
              class="px-3 py-2 rounded bg-slate-900/60 border border-white/10"
            />
            <select
              id="statusFilter"
              class="px-3 py-2 rounded bg-slate-900/60 border border-white/10"
            >
              <option value="">all</option>
              <option>queued</option>
              <option>processing</option>
              <option>completed</option>
              <option>failed</option>
            </select>
            <select
              id="sort"
              class="px-3 py-2 rounded bg-slate-900/60 border border-white/10"
            >
              <option value="-created_at">newest</option>
              <option value="created_at">oldest</option>
              <option value="title">title A-Z</option>
              <option value="-title">title Z-A</option>
              <option value="status">status A-Z</option>
              <option value="-status">status Z-A</option>
            </select>
            <button
              id="applyFilters"
              class="px-4 py-2 rounded bg-white/10 hover:bg-white/20"
            >
              Apply
            </button>
          </div>
        </div>
        <div id="videos" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        <div class="flex items-center justify-between mt-4">
          <button
            id="prevPage"
            class="px-3 py-2 rounded bg-white/10 hover:bg-white/20"
          >
            Prev
          </button>
          <div id="pageInfo" class="text-sm text-slate-300"></div>
          <button
            id="nextPage"
            class="px-3 py-2 rounded bg-white/10 hover:bg-white/20"
          >
            Next
          </button>
        </div>
      </section>

      <template id="videoTpl">
        <div
          class="video-card rounded-xl border border-white/10 bg-slate-900/40 p-3"
        >
          <div class="flex items-center justify-between mb-2">
            <span class="title font-semibold truncate max-w-[70%]"></span>
            <span class="status text-xs px-2 py-1 rounded bg-white/10"></span>
          </div>
          <img class="thumb w-full aspect-video object-cover rounded mb-2" />
          <div class="tags flex flex-wrap gap-2 mb-2"></div>
          <div class="flex items-center gap-2">
            <button
              class="playBtn px-3 py-2 rounded bg-white/10 hover:bg-white/20"
            >
              Play
            </button>
            <button
              class="dl1080 px-3 py-2 rounded bg-white/10 hover:bg-white/20"
            >
              1080p
            </button>
            <button
              class="dl720 px-3 py-2 rounded bg-white/10 hover:bg-white/20"
            >
              720p
            </button>
            <button
              class="dl480 px-3 py-2 rounded bg-white/10 hover:bg-white/20"
            >
              480p
            </button>
          </div>
        </div>
      </template>
    </div>

    <script src="index.js"></script>
  </body>
</html>
